[project]
name = "prompt-firewall"
version = "0.1.0"
description = "LLM safety middleware: input and output checks around an LLM call, with a decision record per request."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.10,<3",
    "fastapi>=0.165,<1",
    "httpx>=0.28,<1",
    "joblib>=1.4,<2",
    "numpy>=2.0,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.9,<2",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "pyarrow>=26,<27",
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[project.optional-dependencies]
# Only needed for the transformer experiment (training/train_transformer.py).
transformer = [
    "torch>=2.11,<2.12",  # last release with macOS 11-13 arm64 wheels
    "transformers>=5.23,<6",
    "safetensors>=0.8,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["firewall", "eval", "training"]

[tool.ruff.lint.per-file-ignores]
# regex rule tables and markdown table builders read better unwrapped
"src/firewall/checks/regex_rules.py" = ["E501", "RUF001"]
"eval/run_eval.py" = ["E501", "RUF001"]
