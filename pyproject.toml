[project]
name = "prompt-firewall"
version = "0.1.0"
description = "LLM safety middleware: input and output checks around an LLM call, with a decision record per request."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.10,<3",
    "fastapi>=0.165,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.16,<3",
    "pyyaml>=6.0,<7",
    "uvicorn>=0.54,<1",
]

[dependency-groups]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firewall"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
