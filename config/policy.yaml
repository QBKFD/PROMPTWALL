# Which checks run at each stage, and what happens when one triggers.
#   action:   block | mask | log   (mask only for checks that report spans)
#   on_error: block | log          (what to do if the check itself fails; default block)
version: 1

input:
  stop_on_block: false   # run every input check so the decision record is complete
  checks:
    # Credentials are never forwarded: block rather than mask, because a masked
    # key in a user's message usually means the user should rotate it anyway.
    - check: secrets_regex
      action: block
      on_error: block

    # Personal data is masked so the request stays usable but the LLM never sees it.
    - check: pii_regex
      action: mask
      on_error: block
      params:
        entities: [email, iban, phone]
        iban_checksum: true

    # Suspected prompt injection is logged, not blocked (author decision, see
    # docs/decisions.md #13): out of distribution the classifier has a very high
    # false-positive rate (results/results.md). The threshold comes from the model's
    # metadata (chosen by cross-validation on the training split).
    - check: injection_classifier
      action: log
      on_error: block
      params:
        model_path: models/injection_tfidf.joblib
    # Comparison model only (docs/decisions.md #11-13), not used by the service; needs
    # `uv sync --extra transformer` and training/train_transformer.py --final-only.
    # - check: injection_transformer
    #   action: log
    #   on_error: block
    #   params:
    #     model_path: models/injection_transformer

output:
  stop_on_block: true    # skip remaining (possibly paid) output checks once one blocks
  checks:
    # Cheap deterministic pass on the answer; the LLM judge is added in stage 3.
    - check: pii_regex
      action: mask
      on_error: block
      params:
        entities: [email, iban, phone]

input_block_message: "Your message was blocked by the safety policy."
output_block_message: "The answer was withheld by the safety policy."
